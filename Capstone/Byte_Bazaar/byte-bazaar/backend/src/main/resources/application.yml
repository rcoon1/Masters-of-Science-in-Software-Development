spring:
  config:
    import: optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/byte_bazaar}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
server:
  port: ${PORT:18080}
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

# Photos are stored in MySQL and survive application restarts.
